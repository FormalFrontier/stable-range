status:
  scope: >-
    The previously reviewed and privately released library comprises twelve
    mathematical leaves, an aggregate root and a private regression client.
    These 25 principal entries summarize the reusable mathematics rather than
    enumerate every declaration. Source interpretation and coverage remain
    separate; the selected book is not claimed fully formalized.
  main_results:
    - declaration: "Bass.StableRangeCondition"
      file: "StableRange/Basic.lean"
      note: >-
        Bass S_n uses finite right-unimodular rows with witness coefficients
        on the right; IsStableRange is a relational least natural index,
        not a default value when no finite bound exists.
    - declaration: "Bass.stableRangeCondition_mono"
      file: "StableRange/Basic.lean"
      note: "S_m implies S_n for m <= n, over arbitrary possibly noncommutative rings."
    - declaration: "Bass.stableRangeCondition_of_surjective"
      file: "StableRange/Quotient.lean"
      note: "Stable-range conditions descend along surjective ring homomorphisms."
    - declaration: "Bass.stableRangeCondition_quotient_iff"
      file: "StableRange/Quotient.lean"
      note: >-
        Quotienting by a quasiregular two-sided ideal preserves every S_n;
        reflection is not asserted for arbitrary quotient ideals.
    - declaration: "Bass.stableRange_one_of_isLocalRing"
      file: "StableRange/Local.lean"
      note: >-
        A native possibly noncommutative local ring has least stable range
        one. The native local-ring hypotheses exclude the zero ring.
    - declaration: "Bass.stableRangeCondition_one_isDedekindFinite"
      file: "StableRange/Regular.lean"
      note: "S_1 makes every one-sided inverse two-sided."
    - declaration: "Bass.isUnitRegular_iff_stableRangeCondition_one"
      file: "StableRange/Regular.lean"
      note: >-
        For a von Neumann-regular ring, unit-regularity is equivalent to S_1.
        Replacing S_1 by least stable range one additionally requires Nontrivial.
    - declaration: "Bass.principalRightIdeals_isCompl_of_innerInverse"
      file: "StableRange/Regular.lean"
      note: >-
        An inner inverse x for a gives complementary aR and (1-a*x)R,
        represented as submodules over the opposite ring.
    - declaration: "Bass.not_isUnitRegular_moduleEnd_finsupp_nat"
      file: "StableRange/Regular.lean"
      note: >-
        The endomorphism ring of a countable direct sum of copies of any
        nonzero additive module is not unit-regular. Neither the coefficient
        module nor this direct sum is asserted to be free.
    - declaration: "Bass.exists_linearEquiv_of_prod_of_end_stableRangeCondition_one"
      file: "StableRange/Cancellation.lean"
      note: >-
        If End_R(M) satisfies S_1, an equivalence M x A = M x B gives an
        equivalence A = B, with no finiteness or projectivity hypothesis.
    - declaration: "Bass.IsUnitRegular.subsingleton_of_fin_linearEquiv_fin_prod"
      file: "StableRange/Cancellation.lean"
      note: >-
        Finite powers of the regular right module over a unit-regular ring
        cannot absorb a nontrivial complementary module, including power zero.
    - declaration: "Bass.isVonNeumannRegular_moduleEnd"
      file: "StableRange/DivisionRing.lean"
      note: "The endomorphism ring of any vector space over a division ring is regular."
    - declaration: "Bass.isUnitRegular_matrix"
      file: "StableRange/DivisionRing.lean"
      note: >-
        Every finite square matrix ring over a division ring is unit-regular,
        including the empty index case; finite dimension supplies automorphic
        inner inverses, unlike the arbitrary-vector-space assertion.
    - declaration: "Matrix.repeatBlockHom"
      file: "StableRange/RepeatedBlock.lean"
      note: >-
        Repeating square matrices on finite diagonal blocks is a ring
        homomorphism at NonAssocSemiring generality. Its value is Kronecker
        product with an identity; injectivity needs a nonempty block family.
    - declaration: "Matrix.rowRank"
      file: "StableRange/DivisionRingRank.lean"
      note: >-
        Finrank of the range of the left-linear row-vector map given by
        right multiplication, over a possibly noncommutative division ring.
        The API includes multiplication bounds, reindex invariance and
        additivity on mutually orthogonal idempotents.
    - declaration: "Matrix.exists_rowRank_eq"
      file: "StableRange/DivisionRingRank.lean"
      note: "Every natural rank bounded by the finite square size is realized."
    - declaration: "Matrix.rowRank_repeatBlock"
      file: "StableRange/DivisionRingRank.lean"
      note: "Repeated blocks scale row rank by their number, including an empty block family."
    - declaration: "Matrix.normalizedRowRank_repeatBlock"
      file: "StableRange/DivisionRingRank.lean"
      note: >-
        Normalized real rank is preserved for nonempty square matrices and
        nonempty finite block families. Normalized rank of the identity is
        one only under the nonempty-size hypothesis; empty-size division is
        totalized in Lean and does not give that assertion.
    - declaration: "Bass.isVonNeumannRegular_iff_isReduced_and_krullDimLE_zero"
      file: "StableRange/Commutative.lean"
      note: "Commutative regular rings are exactly reduced rings of Krull dimension at most zero."
    - declaration: "Bass.IsVonNeumannRegular.flat"
      file: "StableRange/Commutative.lean"
      note: "Every module over a commutative regular ring is flat, with no finite-generation assumption."
    - declaration: "Bass.stableRangeCondition_one_of_krullDimLE_zero"
      file: "StableRange/CommutativeStableRange.lean"
      note: >-
        Krull dimension at most zero implies S_1 for commutative rings,
        without reducedness or nontriviality. The separate least-index-one
        result requires Nontrivial; the zero ring satisfies S_0.
    - declaration: "Bass.IsVonNeumannRegular.isUnitRegular"
      file: "StableRange/CommutativeStableRange.lean"
      note: "Every commutative regular ring is unit-regular."
    - declaration: "Bass.stableRangeCondition_succ_of_krullDimLE"
      file: "StableRange/BassDimension.lean"
      note: >-
        A commutative noetherian ring of Krull dimension at most d satisfies
        S_(d+1). No reducedness, nontriviality or infinite-residue-field
        assumption is imposed; the proof uses finite-prime avoidance and height.
    - declaration: "Bass.coefficientRowKernelEquivSuccOfStableRangeCondition"
      file: "StableRange/RowKernel.lean"
      note: >-
        Over a commutative ring satisfying S_n, a right-unimodular row of
        length n+1 has kernel explicitly equivalent to the free module on
        Fin n. Monotonicity gives free kernels for lengths at least s+1
        under S_s, without Noetherianity or a dimension bound.
    - declaration: "Bass.coefficientRowKernelEquivOfMatrixInverse"
      file: "StableRange/RowKernel.lean"
      note: >-
        Over a commutative ring, any chosen row i of a matrix with a specified
        two-sided inverse has kernel equivalent to functions on the other
        indices. No stable-range assumption is used; i : Fin n supplies
        nonemptiness and n=1 gives the empty complementary index type.

