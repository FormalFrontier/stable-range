  methods:
    - method: "agent"
      framework: "Hive-managed AI agents using Lean and Lake"
      tool_setup: >-
        Prism authored the stable-range, regularity, cancellation, rank,
        dimension and two-shear row-kernel developments and retained research.
        A distinct invertible-row-kernel contributor specialized native
        LinearMap.iInfKerProjEquiv and composed project kernel transport.
        Agents used compiler feedback, native mathlib APIs and Lean tactics
        including simp, rw, ext, ring, noncomm_ring, abel and omega.
      prompting_notes: >-
        Bounded assignments required reusable native interfaces, exact
        assumptions and multiplication order, boundary cases, pinned builds,
        retained provenance and separate independent mathematical review.
  notes: >-
    Code, proofs, documentation and this metadata were authored by AI agents.
    The original Anchor-derived API adapter and 23 authored notes have a
    distinct contributor from later lifecycle and native-source-link fixes.
    The isolated prefix-recursor fixture and the production Bass.prefixIdeal
    replacement also have distinct contributors; authoring is not review.
    No human mathematical review or source-author endorsement is asserted.
    AI generation does not establish correctness, originality, copyright
    ownership or clearance.

fidelity:
  divergences: >-
    Right-coefficient rows and relational least indices make conventions
    explicit. S_1 is not silently identified with least stable range one in
    the zero ring. Right matrix multiplication acts on left-linear row-vector
    maps; arbitrary countable direct sums are not called free modules.
    Native local-ring hypotheses are distinct from a source-specific local
    convention. Noncommutative, commutative, finite-dimensional and nonempty
    hypotheses are kept separate. Repeated blocks were extracted from the
    project's rank development, not independently reinvented.
    No general Morita-invariance theorem, stable GL, factorial colimit,
    arbitrary stably-free cancellation, K-theory or complete source coverage
    follows from this bounded library.

