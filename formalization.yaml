version: "v0.4"

project:
  name: "stable-range"
  description: >-
    Bass stable-range conditions for finite right-unimodular rows, quotient
    and local-ring consequences, regular and unit-regular rings, cancellation,
    division-ring matrix row rank and repeated blocks, commutative dimension
    bounds, explicit coefficient-row kernel equivalences, and elementary
    diagonalization over commutative rings satisfying Bass S_1, with
    determinant-one generation and the stable elementary quotient. General rings
    need not be commutative; commutative and division-ring results retain their
    separate hypotheses.
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Prism (on behalf of the source-maintainer team)"
  license: "Apache-2.0"

sources:
  - title: "The K-book: An Introduction to Algebraic K-theory"
    authors:
      - "Charles A. Weibel"
    id: "https://sites.math.rutgers.edu/~weibel/Kbook/Kbook.pdf"
    type: "book"
    location: >-
      Complete-book build dated 2013-08-29: Chapter I stable-range and
      module-theoretic material, including Exercises I.1.12(v) and I.1.13.
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      Selected constructions and consequences are reorganized into reusable
      ring, matrix and module APIs; this is not a complete formalization of
      these exercises, Chapter I or the book. The noetherian
      dimension bound is proved in Lean through finite-prime avoidance and
      height induction; it is not imported as an unproved literature premise.
      No book PDF, scan or quoted passage is shipped. No explicit license or
      broader redistribution grant for the book was established; source access
      is not permission to reproduce it.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/tree/83abb3e776bdefcbc447a1e44d0debe4010039e5"
    relationship: "builds-on"
    note: >-
      Reuses native rings, units, ideals, local rings, modules, linear maps,
      submodule complements, finite matrices, finrank, localization, flatness,
      minimal primes and Krull dimension. Native source files are not vendored;
      mathlib retains its authorship and license notices. The Lake manifest
      contains generated dependency records derived from mathlib's manifest.
  - id: "https://github.com/FormalFrontier/general-linear-groups/commit/b1ae6c3bf18cf31acad0568969617c8a312f68fd"
    relationship: "builds-on"
    note: >-
      The declared project dependency supplies quasiregular two-sided ideals,
      their unit characterization and the Jacobson radical theorem, as well
      as elementary subgroups, diagonal units, finite reindexing, the
      rectangular upper shear and its first-column action, and the conditional
      unit-pivot induction used for elementary diagonalization. The published
      dependency is not vendored and retains its own authorship, license and
      source history.
status:
  scope: >-
    The aggregate root imports the mathematical leaves, including elementary
    unit pivots and diagonalization over commutative S_1 rings. It also imports
    finite determinant-one generation, the stable determinant kernel theorem
    and the quotient-to-units equivalence under S_1. A separate test
    root imports PublicAPIClient and ElementaryGenerationClient, with test-only
    zero-ring and rank-one fixtures and a nonlocal product-of-fields example.
    Bass S_1 need not mean least stable index one: the zero ring also has S_0.
    The principal results below summarize proved mathematics rather than
    enumerate every declaration or claim full coverage of the source.
  main_results:
    - declaration: "Bass.StableRangeCondition"
      file: "StableRange/Basic.lean"
      note: >-
        Bass S_n uses finite right-unimodular rows with witness coefficients
        on the right; IsStableRange is a relational least natural index,
        not a default value when no finite bound exists.
    - declaration: "Bass.stableRangeCondition_mono"
      file: "StableRange/Basic.lean"
      note: "S_m implies S_n for m <= n, over arbitrary possibly noncommutative rings."
    - declaration: "Bass.stableRangeCondition_of_surjective"
      file: "StableRange/Quotient.lean"
      note: "Stable-range conditions descend along surjective ring homomorphisms."
    - declaration: "Bass.stableRangeCondition_quotient_iff"
      file: "StableRange/Quotient.lean"
      note: >-
        Quotienting by a quasiregular two-sided ideal preserves every S_n;
        reflection is not asserted for arbitrary quotient ideals.
    - declaration: "Bass.stableRange_one_of_isLocalRing"
      file: "StableRange/Local.lean"
      note: >-
        A native possibly noncommutative local ring has least stable range
        one. The native local-ring hypotheses exclude the zero ring.
    - declaration: "Bass.stableRangeCondition_one_isDedekindFinite"
      file: "StableRange/Regular.lean"
      note: "S_1 makes every one-sided inverse two-sided."
    - declaration: "Bass.isUnitRegular_iff_stableRangeCondition_one"
      file: "StableRange/Regular.lean"
      note: >-
        For a von Neumann-regular ring, unit-regularity is equivalent to S_1.
        Replacing S_1 by least stable range one additionally requires Nontrivial.
    - declaration: "Bass.principalRightIdeals_isCompl_of_innerInverse"
      file: "StableRange/Regular.lean"
      note: >-
        An inner inverse x for a gives complementary aR and (1-a*x)R,
        represented as submodules over the opposite ring.
    - declaration: "Bass.not_isUnitRegular_moduleEnd_finsupp_nat"
      file: "StableRange/Regular.lean"
      note: >-
        The endomorphism ring of a countable direct sum of copies of any
        nonzero additive module is not unit-regular. Neither the coefficient
        module nor this direct sum is asserted to be free.
    - declaration: "Bass.exists_linearEquiv_of_prod_of_end_stableRangeCondition_one"
      file: "StableRange/Cancellation.lean"
      note: >-
        If End_R(M) satisfies S_1, an equivalence M x A = M x B gives an
        equivalence A = B, with no finiteness or projectivity hypothesis.
    - declaration: "Bass.IsUnitRegular.subsingleton_of_fin_linearEquiv_fin_prod"
      file: "StableRange/Cancellation.lean"
      note: >-
        Finite powers of the regular right module over a unit-regular ring
        cannot absorb a nontrivial complementary module, including power zero.
    - declaration: "Bass.isVonNeumannRegular_moduleEnd"
      file: "StableRange/DivisionRing.lean"
      note: "The endomorphism ring of any vector space over a division ring is regular."
    - declaration: "Bass.isUnitRegular_matrix"
      file: "StableRange/DivisionRing.lean"
      note: >-
        Every finite square matrix ring over a division ring is unit-regular,
        including the empty index case; finite dimension supplies automorphic
        inner inverses, unlike the arbitrary-vector-space assertion.
    - declaration: "Matrix.repeatBlockHom"
      file: "StableRange/RepeatedBlock.lean"
      note: >-
        Repeating square matrices on finite diagonal blocks is a ring
        homomorphism at NonAssocSemiring generality. Its value is Kronecker
        product with an identity; injectivity needs a nonempty block family.
    - declaration: "Matrix.rowRank"
      file: "StableRange/DivisionRingRank.lean"
      note: >-
        Finrank of the range of the left-linear row-vector map given by
        right multiplication, over a possibly noncommutative division ring.
        The API includes multiplication bounds, reindex invariance and
        additivity on mutually orthogonal idempotents.
    - declaration: "Matrix.exists_rowRank_eq"
      file: "StableRange/DivisionRingRank.lean"
      note: "Every natural rank bounded by the finite square size is realized."
    - declaration: "Matrix.rowRank_repeatBlock"
      file: "StableRange/DivisionRingRank.lean"
      note: "Repeated blocks scale row rank by their number, including an empty block family."
    - declaration: "Matrix.normalizedRowRank_repeatBlock"
      file: "StableRange/DivisionRingRank.lean"
      note: >-
        Normalized real rank is preserved for nonempty square matrices and
        nonempty finite block families. Normalized rank of the identity is
        one only under the nonempty-size hypothesis; empty-size division is
        totalized in Lean and does not give that assertion.
    - declaration: "Bass.isVonNeumannRegular_iff_isReduced_and_krullDimLE_zero"
      file: "StableRange/Commutative.lean"
      note: "Commutative regular rings are exactly reduced rings of Krull dimension at most zero."
    - declaration: "Bass.IsVonNeumannRegular.flat"
      file: "StableRange/Commutative.lean"
      note: "Every module over a commutative regular ring is flat, with no finite-generation assumption."
    - declaration: "Bass.stableRangeCondition_one_of_krullDimLE_zero"
      file: "StableRange/CommutativeStableRange.lean"
      note: >-
        Krull dimension at most zero implies S_1 for commutative rings,
        without reducedness or nontriviality. The separate least-index-one
        result requires Nontrivial; the zero ring satisfies S_0.
    - declaration: "Bass.IsVonNeumannRegular.isUnitRegular"
      file: "StableRange/CommutativeStableRange.lean"
      note: "Every commutative regular ring is unit-regular."
    - declaration: "Bass.stableRangeCondition_succ_of_krullDimLE"
      file: "StableRange/BassDimension.lean"
      note: >-
        A commutative noetherian ring of Krull dimension at most d satisfies
        S_(d+1). No reducedness, nontriviality or infinite-residue-field
        assumption is imposed; the proof uses finite-prime avoidance and height.
    - declaration: "Bass.coefficientRowKernelEquivSuccOfStableRangeCondition"
      file: "StableRange/RowKernel.lean"
      note: >-
        Over a commutative ring satisfying S_n, a right-unimodular row of
        length n+1 has kernel explicitly equivalent to the free module on
        Fin n. Monotonicity gives free kernels for lengths at least s+1
        under S_s, without Noetherianity or a dimension bound.
    - declaration: "Bass.coefficientRowKernelEquivOfMatrixInverse"
      file: "StableRange/RowKernel.lean"
      note: >-
        Over a commutative ring, any chosen row i of a matrix with a specified
        two-sided inverse has kernel equivalent to functions on the other
        indices. No stable-range assumption is used; i : Fin n supplies
        nonemptiness and n=1 gives the empty complementary index type.
    - declaration: "Matrix.GeneralLinearGroup.exists_elementary_unit_pivot_of_stableRangeCondition_one"
      file: "StableRange/ElementaryGeneration.lean"
      note: >-
        Bass S_1 over a commutative ring yields an elementary left factor with
        a unit leading entry for every invertible successor-rank matrix,
        including rank one and the zero ring; locality is not required.
    - declaration: "Matrix.GeneralLinearGroup.exists_elementary_diagonalization_of_stableRangeCondition_one"
      file: "StableRange/ElementaryGeneration.lean"
      note: >-
        Two-sided elementary factors diagonalize every invertible Fin n matrix
        into units under commutative S_1, including the empty matrix. The
        generic all-rank unit-pivot induction comes from general-linear-groups.
    - declaration: "Matrix.GeneralLinearGroup.exists_elementary_diagonalization_finite_of_stableRangeCondition_one"
      file: "StableRange/ElementaryGeneration.lean"
      note: >-
        The same diagonalization transports along a finite equivalence to any
        finite decidable index type, without a chosen order or Nontrivial.
    - declaration: "Matrix.GeneralLinearGroup.mem_elementarySubgroup_iff_det_eq_one_of_stableRangeCondition_one"
      file: "StableRange/DeterminantGeneration.lean"
      note: >-
        Over a commutative S_1 ring, an invertible matrix at any finite
        decidable index type is elementary exactly when its determinant is one;
        the empty index type and the zero ring are included.
    - declaration: "Matrix.GeneralLinearGroup.StableGL.elementary_eq_ker_det_of_stableRangeCondition_one"
      file: "StableRange/DeterminantGeneration.lean"
      note: >-
        The stable elementary subgroup is the kernel of the stable determinant,
        by reducing a stable representative to a finite stage.
    - declaration: "Matrix.GeneralLinearGroup.StableGL.quotientDetMulEquivOfStableRangeConditionOne"
      file: "StableRange/DeterminantGeneration.lean"
      note: >-
        The stable elementary quotient is equivalent to the coefficient units;
        the forward map is the quotient determinant and the inverse is the
        existing rank-one section.

automation:
  methods:
    - method: "agent"
      framework: "AI agents using Lean and Lake"
      tool_setup: >-
        Lean compiler feedback, mathlib APIs and tactics including simp, rw,
        ext, ring, noncomm_ring, abel and omega.
  notes: >-
    AI agents authored code, proofs, documentation and metadata. No human
    mathematical review or source-author endorsement is asserted. AI generation
    does not establish correctness, originality, copyright ownership or clearance.

fidelity:
  divergences: >-
    Right-coefficient rows and relational least indices make conventions
    explicit. S_1 is not silently identified with least stable range one in
    the zero ring. Right matrix multiplication acts on left-linear row-vector
    maps; arbitrary countable direct sums are not called free modules.
    Native local-ring hypotheses are distinct from a source-specific local
    convention. Noncommutative, commutative, finite-dimensional and nonempty
    hypotheses are kept separate.
    No general Morita-invariance theorem, new stable GL construction, factorial colimit,
    arbitrary stably-free cancellation, K-theory or complete source coverage
    follows from this bounded library.

review:
  status: "author-verified"
  notes: >-
    Metadata verification does not establish independent source correspondence,
    rights clearance or complete coverage of the book.

acknowledgements: >-
  The mathlib community supplies the underlying algebraic formalizations;
  general-linear-groups supplies quasiregular-ideal theory. Their own authorship
  and notices remain with the dependencies. Lean and Lake supply the proof
  assistant and build system. Weibel's bibliographic authorship and Bass's
  mathematical attribution are distinct from project formalization authorship.
  The project's Apache-2.0 license does not establish ownership or permission
  to relicense third-party expression.
